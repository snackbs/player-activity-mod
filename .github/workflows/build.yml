name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        # Windows 上 git add 不会记录可执行位，CI checkout 后需手动补上
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: player-activity-jars
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    # 仅在推送 v* 标签时创建 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # body_path 需要仓库内容（RELEASE_NOTES.md）
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: player-activity-jars
          path: build/libs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          # 更新日志正文来自 RELEASE_NOTES.md；generate_release_notes 作为兜底追加变更列表
          # 注意：body_path 会把该文件**整篇**当作正文，所以发布前要用新版本小节整体替换它，
          # 不要把新小节追加在旧内容前面（否则旧版本的更新日志会一起出现在发布页上）
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # 同名 Release 已存在时更新它（例如补正更新日志后重新推送同一个标签）
          allowUpdates: true
