# Gradle 运行参数
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric 工具链版本（可在 https://fabricmc.net/develop 查询最新）
minecraft_version=26.1
# 最低运行要求 0.19.3（fabric.mod.json 同步声明 >=0.19.3），按该版本编译以验证 API 兼容
loader_version=0.19.3
loom_version=1.18-SNAPSHOT
# 0.155.3+26.1.2 同时兼容 26.1 / 26.1.1 / 26.1.2
fabric_api_version=0.155.3+26.1.2

# 模组属性
version=1.1.2
group=com.example
